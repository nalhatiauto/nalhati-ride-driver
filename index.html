<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nalhati Ride Driver</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 15px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .booking {
      border-left: 5px solid #2196f3;
    }

    .row {
      margin: 8px 0;
      line-height: 1.4;
    }

    .label {
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 11px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
    }

    .accept {
      background: #2196f3;
      color: white;
    }

    .fare {
      background: #4caf50;
      color: white;
    }

    .notify {
      background: #ff9800;
      color: white;
    }

    .call {
      background: #673ab7;
      color: white;
    }

    .status {
      font-weight: bold;
      color: #2196f3;
      margin-top: 8px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 25px;
    }

    .error {
      color: #d32f2f;
      font-weight: bold;
    }

  </style>
</head>

<body>

  <h1>🚕 Nalhati Ride Driver</h1>

  <div class="subtitle">
    Driver Dashboard
  </div>


  <!-- Driver Status -->

  <div class="card">

    <div>
      <b>Driver:</b> Nalhati Ride Driver
    </div>

    <div id="connection" class="status">
      Firebase সংযোগ হচ্ছে...
    </div>

    <button
      id="notifyBtn"
      class="notify">
      🔔 Notification চালু করুন
    </button>

  </div>


  <!-- Bookings -->

  <div id="bookings">

    <div class="empty">
      বুকিং খোঁজা হচ্ছে...
    </div>

  </div>


  <script type="module">


    // =====================================
    // Firebase Imports
    // =====================================

    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      onSnapshot,
      doc,
      updateDoc
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    import {
      getMessaging,
      getToken,
      onMessage
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js";


    // =====================================
    // Firebase Configuration
    // =====================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyD4gHM7Gx061qBHSvK-JEQg0HW9EO5z84c",

      authDomain:
        "nalhati-ride.firebaseapp.com",

      databaseURL:
        "https://nalhati-ride-default-rtdb.firebaseio.com",

      projectId:
        "nalhati-ride",

      storageBucket:
        "nalhati-ride.firebasestorage.app",

      messagingSenderId:
        "1077953215118",

      appId:
        "1:1077953215118:web:7d73eac073d30523dda7df",

      measurementId:
        "G-BPZT7JKDH7"
    };


    // =====================================
    // Firebase Start
    // =====================================

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);

    const messaging =
      getMessaging(app);


    // =====================================
    // Elements
    // =====================================

    const bookingsDiv =
      document.getElementById("bookings");

    const connectionDiv =
      document.getElementById("connection");

    const notifyBtn =
      document.getElementById("notifyBtn");


    // =====================================
    // Notification
    // =====================================

    async function enableNotifications() {

      try {

        if (!("Notification" in window)) {

          alert(
            "এই Browser Notification support করে না।"
          );

          return;
        }


        const permission =
          await Notification.requestPermission();


        if (permission !== "granted") {

          alert(
            "🔕 Notification অনুমতি দেওয়া হয়নি।"
          );

          return;
        }


        // Service Worker

        const registration =
          await navigator.serviceWorker.register(
            "/nalhati-ride-driver/firebase-messaging-sw.js"
          );


        // FCM Token

        const token =
          await getToken(
            messaging,
            {

              vapidKey:
                "BPNApamcrhBWi21BnWP9JNg06-XhlqMRWugv-uEF7Dta1UsR7SAImCdmNyp8Jq36CcQZLqWmPU9GYJoFzE5UA4w",

              serviceWorkerRegistration:
                registration

            }
          );


        console.log(
          "FCM Token:",
          token
        );


        if (!token) {

          alert(
            "FCM Token পাওয়া যায়নি।"
          );

          return;
        }


        // Token save

        localStorage.setItem(
          "nalhatiRideDriverFCMToken",
          token
        );


        notifyBtn.textContent =
          "🟢 Notification চালু আছে";


        notifyBtn.disabled =
          true;


        alert(
          "🔔 Driver Notification চালু হয়েছে!"
        );


      }

      catch (error) {

        console.error(
          "Notification Error:",
          error
        );


        alert(
          "FCM ERROR:\n\n" +
          error.name +
          "\n" +
          error.message
        );

      }

    }


    notifyBtn.onclick =
      enableNotifications;


    // =====================================
    // Foreground Notification
    // =====================================

    onMessage(
      messaging,
      payload => {

        console.log(
          "Foreground notification:",
          payload
        );


        const title =
          payload.notification?.title ||
          "🚕 Nalhati Ride";


        const body =
          payload.notification?.body ||
          "নতুন Ride Booking এসেছে।";


        if (
          Notification.permission ===
          "granted"
        ) {

          new Notification(
            title,
            {
              body: body
            }
          );

        }

      }
    );


    // =====================================
    // Anonymous Login
    // =====================================

    signInAnonymously(auth)

      .catch(error => {

        console.error(
          "Anonymous Login Error:",
          error
        );


        connectionDiv.textContent =
          "❌ Firebase Login হচ্ছে না";


        connectionDiv.className =
          "status error";

      });


    // =====================================
    // Auth State
    // =====================================

    onAuthStateChanged(
      auth,
      user => {

        if (!user) {
          return;
        }


        connectionDiv.textContent =
          "🟢 Firebase Connected";


        listenBookings();

      }
    );


    // =====================================
    // Booking Listener
    // =====================================

    let firstSnapshot =
      true;


    function listenBookings() {

      const ridesRef =
        collection(
          db,
          "rides"
        );


      onSnapshot(

        ridesRef,


        snapshot => {


          // =================================
          // New Booking Notification
          // =================================

          if (!firstSnapshot) {

            snapshot.docChanges()
              .forEach(change => {

                if (
                  change.type === "added"
                ) {

                  const ride =
                    change.doc.data();


                  if (
                    ride.status ===
                    "searching"
                  ) {

                    const from =
                      ride.from ||
                      "Pickup";


                    const to =
                      ride.to ||
                      "Destination";


                    const passengers =
                      ride.passengers ||
                      1;


                    const title =
                      "🚕 নতুন Ride Booking";


                    const body =
                      from +
                      " → " +
                      to +
                      "\n" +
                      passengers +
                      " জন Passenger";


                    if (
                      Notification.permission ===
                      "granted"
                    ) {

                      new Notification(
                        title,
                        {
                          body:
                            body
                        }
                      );

                    }

                  }

                }

              });

          }


          firstSnapshot =
            false;


          // =================================
          // Booking List
          // =================================

          const bookings = [];


          snapshot.forEach(
            item => {

              const data =
                item.data();


              if (
                data.status ===
                "searching"
                ||
                data.status ===
                "accepted"
              ) {

                bookings.push({

                  id:
                    item.id,

                  ...data

                });

              }

            }
          );


          // =================================
          // No Booking
          // =================================

          if (
            bookings.length === 0
          ) {

            bookingsDiv.innerHTML =

              `
              <div class="card empty">
                এখন কোনো নতুন বুকিং নেই।
              </div>
              `;

            return;

          }


          bookingsDiv.innerHTML =
            "";


          bookings.reverse();


          // =================================
          // Display Bookings
          // =================================

          bookings.forEach(
            ride => {


              const card =
                document.createElement(
                  "div"
                );


              card.className =
                "card booking";


              // Fare

              let fareText =
                "";


              if (
                ride.fareStatus ===
                "pending"
                ||
                !ride.fare
              ) {

                fareText =

                  `
                  <div class="row">
                    <span class="label">
                      💰 ভাড়া:
                    </span>

                    Driver ভাড়া জানাবেন
                  </div>
                  `;

              }

              else {

                fareText =

                  `
                  <div class="row">
                    <span class="label">
                      💰 ভাড়া:
                    </span>

                    ₹${ride.fare}
                  </div>
                  `;

              }


              // Booking Card

              card.innerHTML =

                `

                <div class="row">

                  <span class="label">
                    👤 Passenger:
                  </span>

                  ${ride.passengerName || "নাম নেই"}

                </div>


                <div class="row">

                  <span class="label">
                    📞 ফোন:
                  </span>

                  ${
                    ride.phone ||
                    ride.passengerPhone ||
                    "নেই"
                  }

                </div>


                <div class="row">

                  <span class="label">
                    📍 From:
                  </span>

                  ${ride.from || "নেই"}

                </div>


                <div class="row">

                  <span class="label">
                    📍 To:
                  </span>

                  ${ride.to || "নেই"}

                </div>


                <div class="row">

                  <span class="label">
                    👥 Passenger:
                  </span>

                  ${ride.passengers || 1}
                  জন

                </div>


                ${
                  ride.date
                  ?
                  `
                  <div class="row">

                    <span class="label">
                      📅 Date:
                    </span>

                    ${ride.date}

                  </div>
                  `
                  :
                  ""
                }


                ${
                  ride.time
                  ?
                  `
                  <div class="row">

                    <span class="label">
                      ⏰ Time:
                    </span>

                    ${ride.time}

                  </div>
                  `
                  :
                  ""
                }


                ${
                  ride.note
                  ?
                  `
                  <div class="row">

                    <span class="label">
                      📝 Note:
                    </span>

                    ${ride.note}

                  </div>
                  `
                  :
                  ""
                }


                ${fareText}


                <div
                  id="buttons-${ride.id}">
                </div>

                `;


              bookingsDiv.appendChild(
                card
              );


              const buttons =
                document.getElementById(
                  `buttons-${ride.id}`
                );


              // =================================
              // Accept
              // =================================

              if (
                ride.status ===
                "searching"
              ) {

                const acceptBtn =
                  document.createElement(
                    "button"
                  );


                acceptBtn.className =
                  "accept";


                acceptBtn.textContent =
                  "✅ Accept Booking";


                acceptBtn.onclick =
                  () =>
                    acceptBooking(
                      ride.id
                    );


                buttons.appendChild(
                  acceptBtn
                );

              }


              // =================================
              // Final Fare
              // =================================

              if (
                ride.type ===
                "reserve"
                &&
                ride.status ===
                "accepted"
              ) {

                const fareInput =
                  document.createElement(
                    "input"
                  );


                fareInput.type =
                  "number";


                fareInput.placeholder =
                  "Final Fare (₹)";


                fareInput.min =
                  "1";


                buttons.appendChild(
                  fareInput
                );


                const fareBtn =
                  document.createElement(
                    "button"
                  );


                fareBtn.className =
                  "fare";


                fareBtn.textContent =
                  "💰 Final Fare সেট করুন";


                fareBtn.onclick =
                  () =>
                    setFare(
                      ride.id,
                      fareInput.value
                    );


                buttons.appendChild(
                  fareBtn
                );

              }


              // =================================
              // Call Passenger
              // =================================

              if (
                ride.status ===
                "accepted"
              ) {

                const callBtn =
                  document.createElement(
                    "button"
                  );


                callBtn.className =
                  "call";


                callBtn.textContent =
                  "📞 Passenger-কে Call";


                callBtn.onclick =
                  () => {

                    const phone =
                      ride.phone ||
                      ride.passengerPhone;


                    if (phone) {

                      window.location.href =
                        "tel:" +
                        phone;

                    }

                  };


                buttons.appendChild(
                  callBtn
                );

              }

            });

        },


        // ===================================
        // Firestore Error
        // ===================================

        error => {

          console.error(
            "Firestore Error:",
            error
          );


          connectionDiv.textContent =
            "❌ Booking পড়তে সমস্যা হচ্ছে";


          connectionDiv.className =
            "status error";

        }

      );

    }


    // =====================================
    // Accept Booking
    // =====================================

    async function acceptBooking(
      id
    ) {

      try {

        await updateDoc(

          doc(
            db,
            "rides",
            id
          ),

          {

            status:
              "accepted",

            driverName:
              "Nalhati Ride Driver",

            driverPhone:
              "",

            autoNumber:
              ""

          }

        );


        alert(
          "✅ Booking Accepted"
        );


      }

      catch (error) {

        console.error(
          "Accept Error:",
          error
        );


        alert(
          "Booking Accept করা যাচ্ছে না। Firebase Rules পরীক্ষা করতে হবে।"
        );

      }

    }


    // =====================================
    // Final Fare
    // =====================================

    async function setFare(
      id,
      fare
    ) {

      fare =
        Number(fare);


      if (
        !fare ||
        fare <= 0
      ) {

        alert(
          "সঠিক ভাড়া লিখুন।"
        );

        return;

      }


      try {

        await updateDoc(

          doc(
            db,
            "rides",
            id
          ),

          {

            fare:
              fare,

            fareStatus:
              "confirmed",

            fareType:
              "driver_confirmed"

          }

        );


        alert(
          "✅ Final Fare ₹" +
          fare +
          " সেট হয়েছে"
        );


      }

      catch (error) {

        console.error(
          "Fare Error:",
          error
        );


        alert(
          "ভাড়া সেট করা যাচ্ছে না। Firebase Rules পরীক্ষা করতে হবে।"
        );

      }

    }


  </script>

</body>
</html>
