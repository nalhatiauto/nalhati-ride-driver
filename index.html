<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nalhati Ride Driver</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .status {
      padding: 10px;
      border-radius: 10px;
      background: #eee;
      text-align: center;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .online {
      background: #dcfce7;
      color: #166534;
    }

    .offline {
      background: #fee2e2;
      color: #991b1b;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px;
      margin-top: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .green {
      background: #16a34a;
      color: white;
    }

    .red {
      background: #dc2626;
      color: white;
    }

    .blue {
      background: #2563eb;
      color: white;
    }

    .orange {
      background: #f59e0b;
      color: white;
    }

    .gray {
      background: #6b7280;
      color: white;
    }

    .booking {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
    }

    .booking h3 {
      margin-top: 0;
    }

    .route {
      background: #f8fafc;
      padding: 12px;
      border-radius: 10px;
      line-height: 1.7;
      margin: 10px 0;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .row > div {
      flex: 1;
    }

    .label {
      color: #666;
      font-size: 13px;
    }

    .value {
      font-weight: bold;
      margin-top: 2px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      margin-top: 6px;
    }

    .fare-box {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .fare-price {
      font-size: 25px;
      font-weight: bold;
      color: #c2410c;
      text-align: center;
      margin: 8px 0;
    }

    .waiting {
      background: #eff6ff;
      color: #1d4ed8;
      padding: 10px;
      border-radius: 9px;
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }

    .confirmed {
      background: #dcfce7;
      color: #166534;
      padding: 10px;
      border-radius: 9px;
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }

    .started {
      background: #fef3c7;
      color: #92400e;
      padding: 10px;
      border-radius: 9px;
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .small {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    .driver-id {
      word-break: break-all;
      font-size: 12px;
      color: #777;
      background: #f3f4f6;
      padding: 8px;
      border-radius: 7px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🚕 Nalhati Ride</h1>
  <div class="subtitle">Driver App</div>

  <!-- Firebase Status -->
  <div class="card">
    <div id="firebaseStatus" class="status offline">
      Firebase সংযোগ হচ্ছে...
    </div>

    <div class="small">
      Driver ID:
    </div>

    <div id="driverId" class="driver-id">
      -
    </div>
  </div>


  <!-- LIVE LOCATION -->
  <div class="card">

    <h2>📍 Live Location</h2>

    <div id="locationStatus" class="status offline">
      🔴 Live Location বন্ধ
    </div>

    <button
      id="startLocationBtn"
      class="green"
      onclick="startLiveLocation()">
      🟢 Live Location চালু করুন
    </button>

    <button
      id="stopLocationBtn"
      class="red"
      onclick="stopLiveLocation()"
      disabled>
      🔴 Live Location বন্ধ করুন
    </button>

    <div id="locationMessage" class="small" style="margin-top:10px;">
      Passenger-এর জন্য Live Location চালু করতে উপরের বাটনে চাপুন।
    </div>

  </div>


  <!-- BOOKINGS -->
  <div class="card">

    <h2>📋 Booking Requests</h2>

    <div id="bookings">
      <div class="empty">
        Booking খোঁজা হচ্ছে...
      </div>
    </div>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
  }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    onSnapshot,
    doc,
    updateDoc,
    getDoc
  }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  import {
    getDatabase,
    ref,
    set
  }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


  /* =========================
     FIREBASE CONFIG
  ========================== */

  const firebaseConfig = {
    apiKey: "AIzaSyD4gHM7Gx061qBHSvK-JEQg0HW9EO5z84c",
    authDomain: "nalhati-ride.firebaseapp.com",
    databaseURL: "https://nalhati-ride-default-rtdb.firebaseio.com",
    projectId: "nalhati-ride",
    storageBucket: "nalhati-ride.firebasestorage.app",
    messagingSenderId: "1077953215118",
    appId: "1:1077953215118:web:7d73eac073d30523dda7df",
    measurementId: "G-BPZT7JKDH7"
  };


  /* =========================
     INITIALIZE
  ========================== */

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);

  const realtimeDb = getDatabase(app);


  let currentUser = null;

  let locationWatchId = null;

  let liveLocationOn = false;


  /*
    আপাতত Driver-এর নাম।
    পরে চাইলে Driver Profile থেকে পরিবর্তন করা যাবে।
  */

  const DRIVER_NAME = "Nalhati Ride Driver";

  /*
    Driver phone এবং Auto Number
    এখন খালি রাখা হয়েছে।
  */

  const DRIVER_PHONE = "";

  const AUTO_NUMBER = "";


  /* =========================
     ELEMENTS
  ========================== */

  const firebaseStatus =
    document.getElementById("firebaseStatus");

  const driverIdElement =
    document.getElementById("driverId");

  const bookingsElement =
    document.getElementById("bookings");

  const locationStatus =
    document.getElementById("locationStatus");

  const locationMessage =
    document.getElementById("locationMessage");

  const startLocationBtn =
    document.getElementById("startLocationBtn");

  const stopLocationBtn =
    document.getElementById("stopLocationBtn");


  /* =========================
     LOGIN
  ========================== */

  signInAnonymously(auth)
    .catch((error) => {

      console.error(error);

      firebaseStatus.textContent =
        "❌ Firebase Login ব্যর্থ";

      firebaseStatus.className =
        "status offline";

    });


  onAuthStateChanged(auth, (user) => {

    if (!user) return;

    currentUser = user;

    driverIdElement.textContent =
      user.uid;

    firebaseStatus.textContent =
      "🟢 Firebase Connected";

    firebaseStatus.className =
      "status online";

    listenForBookings();

  });


  /* =========================
     FIRESTORE BOOKINGS
  ========================== */

  function listenForBookings() {

    const ridesRef =
      collection(db, "rides");


    onSnapshot(
      ridesRef,

      (snapshot) => {

        const rides = [];


        snapshot.forEach((rideDoc) => {

          const data = rideDoc.data();

          rides.push({
            id: rideDoc.id,
            ...data
          });

        });


        /*
          নতুন booking:
          searching

          নিজের booking:
          fare_sent
          confirmed
          started
        */

        const visibleRides =
          rides.filter((ride) => {

            if (ride.status === "searching") {
              return true;
            }

            if (
              ride.driverId === currentUser.uid &&
              (
                ride.status === "fare_sent" ||
                ride.status === "confirmed" ||
                ride.status === "started"
              )
            ) {
              return true;
            }

            return false;

          });


        /*
          নতুন booking আগে দেখানো হবে।
        */

        visibleRides.sort((a, b) => {

          const aTime =
            a.createdAt?.toMillis
              ? a.createdAt.toMillis()
              : 0;

          const bTime =
            b.createdAt?.toMillis
              ? b.createdAt.toMillis()
              : 0;

          return bTime - aTime;

        });


        renderBookings(visibleRides);

      },

      (error) => {

        console.error(error);

        bookingsElement.innerHTML = `
          <div class="empty">
            ❌ Booking load করা যায়নি।
          </div>
        `;

      }
    );

  }


  /* =========================
     RENDER BOOKINGS
  ========================== */

  function renderBookings(rides) {

    if (!rides.length) {

      bookingsElement.innerHTML = `
        <div class="empty">
          এখন কোনো নতুন Booking নেই।
        </div>
      `;

      return;
    }


    bookingsElement.innerHTML = "";


    rides.forEach((ride) => {

      const card =
        createBookingCard(ride);

      bookingsElement.appendChild(card);

    });

  }


  /* =========================
     BOOKING CARD
  ========================== */

  function createBookingCard(ride) {

    const div =
      document.createElement("div");

    div.className = "booking";


    const passengerName =
      ride.passengerName || "Passenger";

    const passengerPhone =
      ride.passengerPhone || "";

    const from =
      ride.from || "-";

    const to =
      ride.to || "-";

    const passengers =
      ride.passengers || 1;

    const date =
      ride.date || "-";

    const time =
      ride.time || "-";

    const note =
      ride.note || "কোনো Note নেই";


    let html = `

      <h3>👤 ${escapeHtml(passengerName)}</h3>

      <div class="route">

        <div>
          <span class="label">📍 From</span><br>
          <span class="value">
            ${escapeHtml(from)}
          </span>
        </div>

        <div style="margin-top:8px;">
          <span class="label">🏁 To</span><br>
          <span class="value">
            ${escapeHtml(to)}
          </span>
        </div>

      </div>


      <div class="row">

        <div>
          <div class="label">👥 Passenger</div>
          <div class="value">
            ${passengers} জন
          </div>
        </div>

        <div>
          <div class="label">📅 Date</div>
          <div class="value">
            ${escapeHtml(date)}
          </div>
        </div>

      </div>


      <div class="row">

        <div>
          <div class="label">⏰ Time</div>
          <div class="value">
            ${escapeHtml(time)}
          </div>
        </div>

        <div>
          <div class="label">📞 Phone</div>
          <div class="value">
            ${escapeHtml(passengerPhone || "-")}
          </div>
        </div>

      </div>


      <div style="margin-top:10px;">
        <div class="label">📝 Note</div>
        <div class="value">
          ${escapeHtml(note)}
        </div>
      </div>

    `;


    /* =========================
       NEW SEARCHING BOOKING
    ========================== */

    if (ride.status === "searching") {

      html += `

        <div class="fare-box">

          <label>
            💰 Passenger-কে ভাড়া পাঠান
          </label>

          <input
            type="number"
            min="1"
            step="1"
            id="fare-${ride.id}"
            placeholder="যেমন 150"
          >

          <button
            class="orange"
            onclick="sendFare('${ride.id}')">

            💰 ভাড়া পাঠান

          </button>

        </div>

      `;

    }


    /* =========================
       FARE SENT
    ========================== */

    else if (
      ride.status === "fare_sent" &&
      ride.driverId === currentUser.uid
    ) {

      html += `

        <div class="fare-box">

          <div style="text-align:center;">
            পাঠানো ভাড়া
          </div>

          <div class="fare-price">
            ₹${ride.fare || 0}
          </div>

        </div>

        <div class="waiting">
          ⏳ Passenger ভাড়া গ্রহণের অপেক্ষায়
        </div>

        ${callButton(passengerPhone)}

      `;

    }


    /* =========================
       CONFIRMED
    ========================== */

    else if (
      ride.status === "confirmed" &&
      ride.driverId === currentUser.uid
    ) {

      html += `

        <div class="fare-box">

          <div style="text-align:center;">
            ভাড়া
          </div>

          <div class="fare-price">
            ₹${ride.fare || 0}
          </div>

        </div>

        <div class="confirmed">
          ✅ Booking Confirmed
        </div>

        <button
          class="green"
          onclick="startRide('${ride.id}')">

          🚕 Start Ride

        </button>

        ${callButton(passengerPhone)}

      `;

    }


    /* =========================
       STARTED
    ========================== */

    else if (
      ride.status === "started" &&
      ride.driverId === currentUser.uid
    ) {

      html += `

        <div class="fare-box">

          <div style="text-align:center;">
            ভাড়া
          </div>

          <div class="fare-price">
            ₹${ride.fare || 0}
          </div>

        </div>

        <div class="started">
          🚕 Ride Started
        </div>

        <button
          class="red"
          onclick="completeRide('${ride.id}')">

          🏁 Complete Ride

        </button>

        ${callButton(passengerPhone)}

      `;

    }


    div.innerHTML = html;

    return div;

  }


  /* =========================
     CALL PASSENGER
  ========================== */

  function callButton(phone) {

    if (!phone) {

      return `
        <button
          class="gray"
          disabled>
          📞 Passenger-এর ফোন নেই
        </button>
      `;

    }


    return `

      <button
        class="blue"
        onclick="window.location.href='tel:${phone}'">

        📞 Passenger-কে Call করুন

      </button>

    `;

  }


  /* =========================
     SEND FARE
  ========================== */

  window.sendFare = async function(rideId) {

    if (!currentUser) return;


    const input =
      document.getElementById(
        `fare-${rideId}`
      );


    const fare =
      Number(input?.value);


    if (!fare || fare <= 0) {

      alert("সঠিক ভাড়া লিখুন।");

      return;

    }


    try {

      /*
        Booking document আবার পড়ে
        নিশ্চিত করা হচ্ছে যে এখনও searching আছে।
      */

      const rideRef =
        doc(db, "rides", rideId);

      const rideSnap =
        await getDoc(rideRef);


      if (!rideSnap.exists()) {

        alert("Booking আর পাওয়া যাচ্ছে না।");

        return;

      }


      const ride =
        rideSnap.data();


      if (ride.status !== "searching") {

        alert(
          "এই Booking-এ অন্য Driver ইতিমধ্যে ভাড়া পাঠিয়েছেন।"
        );

        return;

      }


      await updateDoc(
        rideRef,
        {

          driverId: currentUser.uid,

          driverName: DRIVER_NAME,

          driverPhone: DRIVER_PHONE,

          autoNumber: AUTO_NUMBER,

          fare: fare,

          originalFare: fare,

          discountAmount: 0,

          fareType: "driver_quote",

          fareStatus: "sent",

          status: "fare_sent",

          driverFareSentAt: new Date()

        }
      );


      alert(
        "✅ Passenger-এর কাছে ভাড়া পাঠানো হয়েছে।"
      );

    }

    catch (error) {

      console.error(error);

      alert(
        "❌ ভাড়া পাঠানো যায়নি।"
      );

    }

  };


  /* =========================
     START RIDE
  ========================== */

  window.startRide = async function(rideId) {

    if (!currentUser) return;


    /*
      Live Location চালু না থাকলে
      আগে চালু করতে বলা হবে।
    */

    if (!liveLocationOn) {

      const confirmStart =
        confirm(
          "Live Location এখন বন্ধ আছে।\n\nRide Start করার আগে Live Location চালু করবেন?"
        );


      if (confirmStart) {

        startLiveLocation();

      }


      return;

    }


    try {

      const rideRef =
        doc(db, "rides", rideId);


      const rideSnap =
        await getDoc(rideRef);


      if (!rideSnap.exists()) {

        alert("Booking পাওয়া যায়নি।");

        return;

      }


      const ride =
        rideSnap.data();


      if (
        ride.driverId !== currentUser.uid
      ) {

        alert("এই Booking আপনার নয়।");

        return;

      }


      if (
        ride.status !== "confirmed"
      ) {

        alert(
          "এই Booking এখন Start করা যাবে না।"
        );

        return;

      }


      await updateDoc(
        rideRef,
        {

          status: "started",

          startedAt: new Date()

        }
      );


      alert(
        "🚕 Ride Started"
      );

    }

    catch (error) {

      console.error(error);

      alert(
        "Ride Start করা যায়নি।"
      );

    }

  };


  /* =========================
     COMPLETE RIDE
  ========================== */

  window.completeRide = async function(rideId) {

    if (!currentUser) return;


    const confirmComplete =
      confirm(
        "আপনি কি এই Ride সম্পূর্ণ করতে চান?"
      );


    if (!confirmComplete) return;


    try {

      const rideRef =
        doc(db, "rides", rideId);


      const rideSnap =
        await getDoc(rideRef);


      if (!rideSnap.exists()) {

        alert("Booking পাওয়া যায়নি।");

        return;

      }


      const ride =
        rideSnap.data();


      if (
        ride.driverId !== currentUser.uid
      ) {

        alert("এই Booking আপনার নয়।");

        return;

      }


      if (
        ride.status !== "started"
      ) {

        alert(
          "এই Ride এখন Complete করা যাবে না।"
        );

        return;

      }


      await updateDoc(
        rideRef,
        {

          status: "completed",

          completedAt: new Date()

        }
      );


      alert(
        "🏁 Ride Completed"
      );

    }

    catch (error) {

      console.error(error);

      alert(
        "Ride Complete করা যায়নি।"
      );

    }

  };


  /* =========================
     LIVE LOCATION START
  ========================== */

  window.startLiveLocation = function() {

    if (!currentUser) {

      alert(
        "Firebase connection এখনো প্রস্তুত নয়।"
      );

      return;

    }


    if (!navigator.geolocation) {

      alert(
        "এই ফোনে Location সুবিধা পাওয়া যাচ্ছে না।"
      );

      return;

    }


    if (locationWatchId !== null) {

      return;

    }


    locationStatus.textContent =
      "🟡 Location চালু হচ্ছে...";

    locationStatus.className =
      "status";


    locationMessage.textContent =
      "ফোনের Location Permission চাইলে Allow করুন।";


    locationWatchId =
      navigator.geolocation.watchPosition(

        async (position) => {

          const lat =
            position.coords.latitude;

          const lng =
            position.coords.longitude;

          const accuracy =
            Math.round(
              position.coords.accuracy || 0
            );


          const locationRef =
            ref(
              realtimeDb,
              `drivers/${currentUser.uid}/location`
            );


          try {

            await set(
              locationRef,
              {

                lat: lat,

                lng: lng,

                accuracy: accuracy,

                updatedAt: Date.now(),

                online: true

              }
            );


            liveLocationOn = true;


            locationStatus.textContent =
              "🟢 Live Location চালু আছে";

            locationStatus.className =
              "status online";


            locationMessage.textContent =
              `Location পাঠানো হচ্ছে। Accuracy প্রায় ${accuracy} মিটার।`;


            startLocationBtn.disabled =
              true;

            stopLocationBtn.disabled =
              false;

          }

          catch (error) {

            console.error(error);

            locationMessage.textContent =
              "❌ Location Firebase-এ পাঠানো যায়নি।";

          }

        },


        (error) => {

          console.error(error);


          let message =
            "Location পাওয়া যায়নি।";


          if (error.code === 1) {

            message =
              "❌ Location Permission দেওয়া হয়নি।";

          }

          else if (error.code === 2) {

            message =
              "❌ Location পাওয়া যাচ্ছে না।";

          }

          else if (error.code === 3) {

            message =
              "❌ Location পাওয়ার সময় শেষ হয়েছে।";

          }


          locationStatus.textContent =
            "🔴 Live Location বন্ধ";

          locationStatus.className =
            "status offline";


          locationMessage.textContent =
            message;


          liveLocationOn = false;


          startLocationBtn.disabled =
            false;

          stopLocationBtn.disabled =
            true;


          locationWatchId = null;

        },


        {
          enableHighAccuracy: true,

          maximumAge: 5000,

          timeout: 15000

        }

      );

  };


  /* =========================
     LIVE LOCATION STOP
  ========================== */

  window.stopLiveLocation = async function() {

    if (!currentUser) return;


    if (locationWatchId !== null) {

      navigator.geolocation.clearWatch(
        locationWatchId
      );

      locationWatchId = null;

    }


    try {

      const locationRef =
        ref(
          realtimeDb,
          `drivers/${currentUser.uid}/location`
        );


      await set(
        locationRef,
        {

          online: false,

          updatedAt: Date.now()

        }
      );


      liveLocationOn = false;


      locationStatus.textContent =
        "🔴 Live Location বন্ধ";

      locationStatus.className =
        "status offline";


      locationMessage.textContent =
        "Passenger আর আপনার Live Location দেখতে পারবে না।";


      startLocationBtn.disabled =
        false;

      stopLocationBtn.disabled =
        true;

    }

    catch (error) {

      console.error(error);

      locationMessage.textContent =
        "Location বন্ধ করার সময় সমস্যা হয়েছে।";

    }

  };


  /* =========================
     ESCAPE HTML
  ========================== */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =========================
     PAGE CLOSE / HIDE
  ========================== */

  window.addEventListener(
    "beforeunload",
    () => {

      /*
        এখানে শুধু browser বন্ধ হওয়ার সময়
        watch বন্ধ করা হচ্ছে।
      */

      if (locationWatchId !== null) {

        navigator.geolocation.clearWatch(
          locationWatchId
        );

      }

    }
  );

</script>

</body>
